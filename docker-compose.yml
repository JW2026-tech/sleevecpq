# Sleeve Technology CPQ on the planning server (SLT-NE-PRODPLAN01).
#
# The CPQ itself: one container. HTTPS is done by the Caddy that is already on the
# server (planningstool-caddy), on both addresses: the public entrance for
# customers (cpq.…, 10.16.12.5) and the internal one for colleagues (cpq-intern.…).
# Its blocks are in deploy/Caddyfile.cpq; Caddy reaches this container, and the
# CPQ's own Supabase (supabase/), over the network cpq-net.
# Step by step: DEPLOY.md.

services:
  cpq:
    build: .
    image: sleeve-cpq:latest
    container_name: sleeve-cpq
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    # for a quick check from the server itself: curl http://127.0.0.1:3100/healthz
    ports:
      - "127.0.0.1:3100:3000"
    mem_limit: 1g
    networks:
      - cpq-net

networks:
  # created once: docker network create cpq-net (DEPLOY.md)
  cpq-net:
    external: true
