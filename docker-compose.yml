# Sleeve Technology CPQ on the planning server (SLT-NE-PRODPLAN01).
#
# Three parts, none shared with the planning tool:
#   - cpq    : the app (page, Odoo lookup, PDF)
#   - caddy  : HTTPS on the CPQ's own IP address (CPQ_BIND_IP, 10.16.12.5)
#   - the CPQ's own Supabase, in supabase/ (its own compose project), reached
#     over the network cpq-net
# Step by step: DEPLOY.md.

services:
  cpq:
    build: .
    image: sleeve-cpq:latest
    container_name: sleeve-cpq
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    # for a quick check from the server itself: curl http://127.0.0.1:3100/healthz
    ports:
      - "127.0.0.1:3100:3000"
    mem_limit: 1g
    networks:
      - cpq-net

  caddy:
    image: caddy:2.11.7
    container_name: sleeve-cpq-caddy
    restart: unless-stopped
    depends_on:
      - cpq
    environment:
      CPQ_DOMAIN: ${CPQ_DOMAIN}
      STAFF_IPS: ${STAFF_IPS:-private_ranges}
    ports:
      - "${CPQ_BIND_IP}:80:80"
      - "${CPQ_BIND_IP}:443:443"
      - "${CPQ_BIND_IP}:443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - cpq-net

networks:
  # created once: docker network create cpq-net (DEPLOY.md, step 3)
  cpq-net:
    external: true

volumes:
  caddy_data:
  caddy_config:
