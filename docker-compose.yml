# Sleeve Technology CPQ on the planning server (SLT-NE-PRODPLAN01).
#
# Two containers:
#   - cpq        the app (server.js, PDF renderer)
#   - cpq-caddy  its own Caddy, HTTPS on 10.16.12.5 only: the public entrance for
#                customers (cpq.sleevetechnology.com). Config: deploy/Caddyfile.cpq.
# The internal entrance for colleagues (cpq-intern.…) stays on the planning tool's
# Caddy on 10.16.12.4 (deploy/Caddyfile.intern). That Caddy must therefore listen
# on 10.16.12.4 only, not on 0.0.0.0, or the two fight over ports 80/443.
# Both reach the app, and the CPQ's own Supabase (supabase/), over cpq-net.
# Step by step: DEPLOY.md.

services:
  cpq:
    build: .
    image: sleeve-cpq:latest
    container_name: sleeve-cpq
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    # for a quick check from the server itself: curl http://127.0.0.1:3100/healthz
    ports:
      - "127.0.0.1:3100:3000"
    mem_limit: 1g
    networks:
      - cpq-net

  cpq-caddy:
    image: caddy:2
    container_name: cpq-caddy
    restart: unless-stopped
    ports:
      - "10.16.12.5:80:80"
      - "10.16.12.5:443:443"
    volumes:
      # the pipeline copies deploy/Caddyfile.cpq to /opt/sleeve-cpq/caddy/Caddyfile
      # and reloads; a folder, so the copy is seen without a restart
      - /opt/sleeve-cpq/caddy:/etc/caddy:ro
      - caddy_data:/data          # certificates: keep this volume
      - caddy_config:/config
    depends_on:
      - cpq
    networks:
      - cpq-net

volumes:
  caddy_data:
  caddy_config:

networks:
  # created once: docker network create cpq-net (DEPLOY.md)
  cpq-net:
    external: true
