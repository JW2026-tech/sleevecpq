# Azure DevOps: every push to main rebuilds the CPQ on the planning server.
#
# The server runs an Azure Pipelines agent, registered as the VM resource of the
# environment "cpq-prod" (DevOps → Pipelines → Environments → cpq-prod → Add
# resource → Virtual machines → Linux; run the registration script it gives on
# the server). The settings (.env, with the keys) stay on the server in
# /opt/sleeve-cpq and never go through the pipeline.
#
# The CPQ container (sleeve-cpq) is rebuilt; its Caddy (cpq-caddy) gets the
# Caddyfile from deploy/Caddyfile.cpq and is reloaded, not restarted. The CPQ's
# The planning tool and its Caddy are left alone; of the CPQ's Supabase only the
# sign-in service is touched (Microsoft sign-in, see the first step).

trigger:
  branches:
    include: [main]

pr: none

stages:
  - stage: deploy
    displayName: Deploy to SLT-NE-PRODPLAN01
    jobs:
      - deployment: cpq
        displayName: Build and restart the CPQ
        environment:
          name: cpq-prod
          resourceType: VirtualMachine
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true
                # Sign in with Microsoft: the CPQ's own Supabase gets the Azure app
                # registration. The three values are secret pipeline variables
                # (DevOps → Pipelines → this pipeline → Edit → Variables), never in
                # the repo; this writes them into /opt/sleeve-cpq/supabase/.env and
                # restarts only the sign-in service, and only when something changed.
                # Runs before the app, so the app never asks for a sign-in the
                # server cannot give yet.
                - script: |
                    set -euo pipefail
                    SB=/opt/sleeve-cpq/supabase
                    for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_SECRET; do
                      val="${!v:-}"
                      if [ -z "$val" ] || [ "${val#\$(}" != "$val" ]; then
                        echo "Pipeline variable $v is not set (Edit → Variables, see DEPLOY.md) — stopping before the app asks colleagues to sign in."; exit 1
                      fi
                    done
                    test -f $SB/.env || { echo "Missing $SB/.env — see supabase/STAPPENPLAN.md"; exit 1; }
                    before=$(md5sum $SB/.env $SB/docker-compose.override.yml 2>/dev/null | md5sum)
                    cp supabase/docker-compose.override.yml $SB/docker-compose.override.yml
                    # set KEY=value in .env: replaced where it is, added at the end otherwise.
                    # The value comes in through the environment, so no character in a
                    # secret can break the command.
                    setkey() {
                      K="$1" V="$2" awk 'BEGIN{k=ENVIRON["K"]; v=ENVIRON["V"]}
                        index($0, k"=")==1 {print k"="v; f=1; next} {print}
                        END{if(!f) print k"="v}' $SB/.env > $SB/.env.new
                      cat $SB/.env.new > $SB/.env && rm -f $SB/.env.new
                    }
                    setkey AZURE_TENANT_ID "$AZURE_TENANT_ID"
                    setkey AZURE_CLIENT_ID "$AZURE_CLIENT_ID"
                    setkey AZURE_SECRET "$AZURE_SECRET"
                    # the CPQ's own addresses: this .env began as a copy of the planning
                    # tool's, and Microsoft must send colleagues back here, not there
                    setkey SITE_URL https://cpq.sleevetechnology.com
                    setkey API_EXTERNAL_URL https://cpq.sleevetechnology.com/sb
                    setkey SUPABASE_PUBLIC_URL https://cpq.sleevetechnology.com/sb
                    setkey ADDITIONAL_REDIRECT_URLS https://quote.sleevetechnology.com
                    setkey DISABLE_SIGNUP false
                    setkey ENABLE_EMAIL_SIGNUP false
                    setkey ENABLE_ANONYMOUS_USERS false
                    after=$(md5sum $SB/.env $SB/docker-compose.override.yml | md5sum)
                    if [ "$before" != "$after" ] || [ -z "$(docker ps -q -f name=^cpq-supabase-auth$)" ]; then
                      (cd $SB && docker compose -p cpq-supabase up -d auth)
                      sleep 5
                    fi
                    # the profiles, the links for the whole team, the admin: safe to run every time
                    docker exec -i cpq-supabase-db psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -q < sql/inloggen-microsoft.sql
                  displayName: Microsoft sign-in (Supabase)
                  workingDirectory: $(Build.SourcesDirectory)
                  env:
                    AZURE_TENANT_ID: $(AZURE_TENANT_ID)
                    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
                    AZURE_SECRET: $(AZURE_SECRET)
                - script: |
                    set -euo pipefail
                    test -f /opt/sleeve-cpq/.env || { echo "Missing /opt/sleeve-cpq/.env — see DEPLOY.md"; exit 1; }
                    cp /opt/sleeve-cpq/.env .env
                    docker compose -p sleeve-cpq up -d --build cpq
                    # Caddy: the config into its folder (copied over the old file, so the
                    # running container sees it), checked, then started or reloaded
                    test -d /opt/sleeve-cpq/caddy || { echo "Missing /opt/sleeve-cpq/caddy — see DEPLOY.md"; exit 1; }
                    cp deploy/Caddyfile.cpq /opt/sleeve-cpq/caddy/Caddyfile
                    docker run --rm -v /opt/sleeve-cpq/caddy:/etc/caddy:ro caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
                    if [ -n "$(docker ps -q -f name=^cpq-caddy$)" ]; then
                      docker exec cpq-caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
                    else
                      docker compose -p sleeve-cpq up -d cpq-caddy
                    fi
                  displayName: docker compose up
                  workingDirectory: $(Build.SourcesDirectory)
                - script: |
                    for i in $(seq 1 30); do
                      curl -fsS http://127.0.0.1:3100/healthz && exit 0
                      sleep 2
                    done
                    echo "The CPQ did not become healthy"; docker logs --tail 50 sleeve-cpq; exit 1
                  displayName: Health check
